<svg xmlns="http://www.w3.org/2000/svg" width="800" height="292" viewBox="0 0 800 292">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .title { font-size: 15px; font-weight: 700; fill: #3d2f25; }
  .sub { font-size: 11px; fill: #8a7563; }
  .shine { animation: shine 7s ease-in-out 2.5s infinite; transform: translateX(-260px); }
  @keyframes shine { 0% { transform: translateX(-260px); } 40%, 100% { transform: translateX(860px); } }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
<defs>
  <linearGradient id="shineGrad" x1="0" x2="1">
    <stop offset="0" stop-color="#d9a679" stop-opacity="0"/>
    <stop offset=".5" stop-color="#d9a679" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#d9a679" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cardClip"><rect x="1" y="1" width="798" height="290" rx="12"/></clipPath>
</defs>
