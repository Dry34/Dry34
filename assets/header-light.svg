<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .wave { animation: wave 10s linear infinite; }
  .wave.back { animation-duration: 16s; animation-direction: reverse; }
  @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-400px); } }
  .fade { opacity: 0; animation: fade .8s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  .type { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: type 16.0s infinite backwards; }
  @keyframes type {
    0% { transform: scaleX(0); animation-timing-function: steps(24); }
    8.75% { transform: scaleX(1); }
    17.50% { transform: scaleX(1); animation-timing-function: steps(12); }
    20.00%, 100% { transform: scaleX(0); }
  }
</style>
