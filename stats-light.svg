<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .title { font-size: 15px; font-weight: 700; fill: #3d2f25; }
  .sub { font-size: 11px; fill: #8a7563; }
  .shine { animation: shine 7s ease-in-out 2.5s infinite; transform: translateX(-260px); }
  @keyframes shine { 0% { transform: translateX(-260px); } 40%, 100% { transform: translateX(860px); } }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes roll { from { transform: translateY(0); } }
  .grow { transform-box: fill-box; transform-origin: center; transform: scaleX(0); animation: grow .6s ease-out forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
