<svg xmlns="http://www.w3.org/2000/svg" width="800" height="508" viewBox="0 0 800 508">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .title { font-size: 15px; font-weight: 700; fill: #f2e6da; }
  .sub { font-size: 11px; fill: #b09a87; }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  .grow { transform-box: fill-box; transform-origin: left; animation: grow 12s infinite backwards; }
  @keyframes grow { 0% { transform: scaleX(0); animation-timing-function: cubic-bezier(.15,.85,.25,1); } 8.33%, 94% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
  .siesta { transform-box: fill-box; transform-origin: left; animation: siesta 12s ease-in-out infinite backwards; }
  @keyframes siesta { 0% { transform: scaleX(0); } 9.17%, 11.67% { transform: scaleX(4.5); } 20.00%, 94% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
  .slide { opacity: 0; transform: translateX(10px); animation: slide .4s ease-out forwards; }
  @keyframes slide { to { opacity: 1; transform: translateX(0); } }
  .type { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: type .7s steps(28) forwards; }
  @keyframes type { to { transform: scaleX(1); } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
